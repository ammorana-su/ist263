<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Javascript Program</title>
    <style>
        h1 {
            cursor: pointer;
        }
    </style>
    <script>
        function SecondBlock() {
            alert('Second Alert');
        }
        function hovery() {
            alert("I'm hovering over this text");
        }
        function clicky() {
            alert("I clicked on a single word.");
        }
    </script>
</head>

<body>
    <script>alert('I am sending an alert!');</script>
    <h1 onclick="SecondBlock()">Classic Firat Javascript Program</h1>
    <p onmouseover="hovery">
        Had an awesome weekend. I just got back from Miami. It was a blast.
    </p>
    <p>
        My favorite artist I saw was <a href="#" onclick= "clicky()">Alesso</a> x Martin Garrix.
    </p>



</body>
</html>
