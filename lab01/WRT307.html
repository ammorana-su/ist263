<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Project Timeline - Anthony Morana</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: white;
            margin: 30px;
            display: flex;
            justify-content: flex-start;
        }

        table {
            /* Width bumped to 880px for that clean, wide horizontal look */
            width: 880px; 
            border-collapse: collapse;
            font-size: 19px; 
            border: 2px solid #333;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.1);
        }

        caption {
            font-size: 24px;
            font-weight: bold;
            padding-bottom: 15px;
            color: #000E54; /* Syracuse Blue */
            text-align: left;
        }

        th {
            background-color: #F76900; /* Syracuse Orange */
            color: white;
            padding: 22px 15px; 
            text-align: center;
            border-bottom: 3px solid #333;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            /* Adjusted to 18px to ensure all 10 rows fit on your screen at once */
            padding: 18px 20px; 
            border-bottom: 1px solid #999;
            text-align: left;
            line-height: 1.2;
        }

        .evenrow {
            background-color: #fff5eb; /* Subtle Syracuse Orange tint */
        }

        .task-num {
            width: 50px;
            text-align: center;
            font-weight: bold;
            color: #F76900;
        }

        .date-col {
            font-weight: bold;
            text-align: right;
            color: #444;
            width: 150px;
        }
    </style>
</head>

<body>
    <table>
        <caption>Project Timeline: Traffic Safety Dashboard</caption>
        <thead>
            <tr>
                <th colspan="2">Task & Deliverable</th>
                <th>Target Date</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="task-num">1</td>
                <td>Topic Approval & Initial Research</td>
                <td class="date-col">Feb 25, 2026</td>
            </tr>
            <tr class="evenrow">
                <td class="task-num">2</td>
                <td>Source Selection & Initial Drafting</td>
                <td class="date-col">Mar 02, 2026</td>
            </tr>
            <tr>
                <td class="task-num">3</td>
                <td>eSurvey Distribution (Psi U Chat)</td>
                <td class="date-col">Mar 10, 2026</td>
            </tr>
            <tr class="evenrow">
                <td class="task-num">4</td>
                <td>Interview: Officer Conor Maloney</td>
                <td class="date-col">Mar 12, 2026</td>
            </tr>
