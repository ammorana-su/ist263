<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Unit 10 Notes Responsive Design</title>
        <style>
            body {font-family: Arial, Helvetica, sans-serif;}
            img {max-width: 100%;}
            .row1 { 
                display: flex;
                flex-wrap: wrap;
                padding: 80px;
                margin-top: 40px;
            }
            .row1 div {
                padding: 40px;
            }
            .bannersmall {
                display: none; 
                border: 3px solid #0000FF;
            }
            .banner {
                display: block;
            }
            @media only screen and (max-width: 800px) {
                body  {background-color: #FF0000;}
                .bannersmall {display: block;}
                .banner {display: none;}
            }
        </style>
    </head>
    <body>
        <div class="row1">
            <div class="banner">
                I'm large
            </div>
            <div class="bannersmall">
                I'm small
            </div>
        </div>
    </body>
</html>
